<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Редактор кода</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0
}

body{
    background:#1e1e1e;
    color:#d4d4d4;
    font-family:Arial,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:10px
}

.container{
    width:100%;
    max-width:800px;
    background:#252526;
    border:1px solid #3c3c3c;
    border-radius:8px;
    overflow:hidden
}

.header{
    min-height:45px;
    padding:8px 12px;
    background:#323233;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:8px
}

.filename-input{
    background:#1e1e1e;
    border:1px solid #3c3c3c;
    border-radius:4px;
    color:#d4d4d4;
    padding:6px 10px;
    font-size:13px;
    outline:none;
    flex:1;
    min-width:140px
}

.filename-input:focus{
    border-color:#0e639c
}

.actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap
}

button{
    border:0;
    border-radius:4px;
    padding:6px 10px;
    background:#0e639c;
    color:white;
    cursor:pointer;
    font-size:13px;
    white-space:nowrap;
    display:inline-flex;
    align-items:center;
    justify-content:center
}

button.clear{
    background:#3c3c3c
}

button.download-btn{
    background:#238636
}

#editor{
    height:400px;
    overflow:hidden
}

.cm-editor{
    height:100%;
    font-size:14px
}

.cm-scroller{
    font-family:Consolas,"Courier New",monospace;
    overflow:auto
}

.cm-gutters{
    background:#1e1e1e!important;
    border-right:1px solid #2d2d2d!important
}

.cm-lineNumbers .cm-gutterElement{
    color:#858585
}

.cm-content{
    padding:15px 0
}

.cm-line{
    padding:0 15px
}

@media(max-width:480px){

    .header{
        flex-direction:column;
        align-items:stretch
    }

    .actions{
        display:grid;
        grid-template-columns:1fr 1fr 1fr;
        gap:6px
    }

    button{
        padding:8px 4px;
        text-align:center
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <input
            type="text"
            id="filename"
            class="filename-input"
            placeholder="Имя файла (напр. script.lua)"
        >

        <div class="actions">

            <button
                class="clear"
                id="clear">
                Очистить
            </button>

            <button id="copy">
                Копировать
            </button>

            <button
                id="download"
                class="download-btn">
                Скачать
            </button>

        </div>

    </div>

    <div id="editor"></div>

</div>


<script type="module">

import {EditorState}
from "https://esm.sh/@codemirror/state";

import {
    EditorView,
    keymap,
    lineNumbers
}
from "https://esm.sh/@codemirror/view";

import {
    defaultKeymap,
    indentWithTab
}
from "https://esm.sh/@codemirror/commands";


// ==================================================
// КЛЮЧИ ХРАНИЛИЩА
// ==================================================

const CODE_KEY = "code_editor_saved_code";
const FILENAME_KEY = "code_editor_saved_filename";


// ==================================================
// ПОЛУЧАЕМ СОХРАНЁННЫЕ ДАННЫЕ
// ==================================================

const savedCode =
    localStorage.getItem(CODE_KEY) || "";

const savedFilename =
    localStorage.getItem(FILENAME_KEY) || "";


// ==================================================
// CODEMIRROR
// ==================================================

const editor =
    document.querySelector("#editor");

const view =
    new EditorView({

        state: EditorState.create({

            doc:savedCode,

            extensions:[

                lineNumbers(),

                keymap.of([
                    indentWithTab,
                    ...defaultKeymap
                ]),

                EditorView.theme({

                    "&":{
                        backgroundColor:"#1e1e1e",
                        color:"#d4d4d4"
                    },

                    ".cm-content":{
                        caretColor:"#fff"
                    },

                    ".cm-cursor":{
                        borderLeftColor:"#fff"
                    },

                    ".cm-selectionBackground":{
                        backgroundColor:"#264f78!important"
                    },

                    ".cm-gutters":{
                        color:"#858585",
                        backgroundColor:"#1e1e1e"
                    }

                })

            ]

        }),

        parent:editor

    });


// ==================================================
// ВОССТАНОВЛЕНИЕ ИМЕНИ ФАЙЛА
// ==================================================

const filenameInput =
    document.querySelector("#filename");

filenameInput.value =
    savedFilename;


// ==================================================
// АВТОСОХРАНЕНИЕ КОДА
// ==================================================

view.dom.addEventListener("input", () => {

    const code =
        view.state.doc.toString();

    localStorage.setItem(
        CODE_KEY,
        code
    );

});


// ==================================================
// АВТОСОХРАНЕНИЕ ИМЕНИ ФАЙЛА
// ==================================================

filenameInput.addEventListener("input", () => {

    localStorage.setItem(
        FILENAME_KEY,
        filenameInput.value
    );

});


// ==================================================
// ОЧИСТИТЬ
// ==================================================

document
.querySelector("#clear")
.addEventListener("click", () => {

    view.dispatch({

        changes:{
            from:0,
            to:view.state.doc.length,
            insert:""
        }

    });

    // Сохраняем пустой редактор

    localStorage.setItem(
        CODE_KEY,
        ""
    );

    view.focus();

});


// ==================================================
// КОПИРОВАТЬ
// ==================================================

document
.querySelector("#copy")
.addEventListener("click", async () => {

    const text =
        view.state.doc.toString();

    try{

        await navigator.clipboard.writeText(text);

    }catch(error){

        const textarea =
            document.createElement("textarea");

        textarea.value = text;

        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";

        document.body.appendChild(textarea);

        textarea.select();

        document.execCommand("copy");

        textarea.remove();

    }

});


// ==================================================
// СКАЧИВАНИЕ
// ==================================================

document
.querySelector("#download")
.addEventListener("click", () => {

    const content =
        view.state.doc.toString();

    let filename =
        filenameInput.value.trim();

    if(!filename){

        filename = "script.txt";

    }


    // ----------------------------------------------
    // НА ВСЯКИЙ СЛУЧАЙ СОХРАНЯЕМ ПОСЛЕДНИЕ ДАННЫЕ
    // ----------------------------------------------

    localStorage.setItem(
        CODE_KEY,
        content
    );

    localStorage.setItem(
        FILENAME_KEY,
        filename
    );


    // ----------------------------------------------
    // ФЛАГ ДЛЯ СКАЧИВАНИЯ ПОСЛЕ ПЕРЕЗАГРУЗКИ
    // ----------------------------------------------

    sessionStorage.setItem(
        "download_after_reload",
        "1"
    );

    sessionStorage.setItem(
        "download_filename",
        filename
    );


    // ----------------------------------------------
    // ПЕРЕЗАГРУЗКА
    // ----------------------------------------------

    location.reload();

});


// ==================================================
// СКАЧАТЬ ПОСЛЕ ПЕРЕЗАГРУЗКИ
// ==================================================

if(
    sessionStorage.getItem(
        "download_after_reload"
    ) === "1"
){

    sessionStorage.removeItem(
        "download_after_reload"
    );


    const filename =
        sessionStorage.getItem(
            "download_filename"
        ) || "script.txt";


    sessionStorage.removeItem(
        "download_filename"
    );


    setTimeout(() => {

        const content =
            view.state.doc.toString();


        const blob =
            new Blob(
                [content],
                {
                    type:
                    "application/octet-stream"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const link =
            document.createElement("a");


        link.href = url;

        link.download = filename;

        link.style.display = "none";


        document.body.appendChild(link);

        link.click();

        link.remove();


        setTimeout(() => {

            URL.revokeObjectURL(url);

        },10000);

    },500);

}

</script>

</body>
</html>
